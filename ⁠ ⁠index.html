<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خيال - منصة المبدعين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>💡 خيال</b><span>منصة المصممين</span></header>
<div class="container">
<div class="card"><span class="badge">منصة عرض الأعمال ✨</span>
<h2>مرحباً في خيال</h2><p>اعرض أعمالك من Canva وألهم غيرك</p>
<input id="email" placeholder="إيميلك">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="btn" onclick="login()">دخول المنصة</button>
</div>
<div class="card"><h3>نشر عمل جديد 🎨</h3>
<input id="workTitle" placeholder="عنوان العمل">
<textarea id="workDesc" placeholder="احكي عن فكرة تصميمك..."></textarea>
<select id="uploadType"><option value="canva">رابط Canva</option><option value="pdf">رفع ملف PDF</option></select>
<input id="canvaLink" placeholder="رابط العمل">
<button class="btn" onclick="addWork()">نشر في المنصة 🚀</button>
</div>
<div class="works-grid" id="worksList"></div>
</div>
<script src="script.js"></script>
</body>
</html>
