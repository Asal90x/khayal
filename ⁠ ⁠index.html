<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خيال - منصة المبدعين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}body{margin:0;background:#f8f7ff}
header{background:#fff;padding:15px 20px;display:flex;justify-content:space-between;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.logo{font-weight:800;color:#7c3aed;font-size:22px}
.wrap{max-width:700px;margin:20px auto;padding:0 15px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 25px #0000000d;margin-bottom:15px}
.badge{background:#ede9fe;color:#7c3aed;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
input,textarea{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px;margin-top:8px}
.btn{width:100%;background:#7c3aed;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header><div class="logo">💡 خيال</div><span>منصة المبدعين</span></header>
<div class="wrap">
<div class="card"><span class="badge">منصة عرض الأعمال ✨</span>
<h2>مرحباً في خيال</h2><p style="color:#777">اعرضي أعمالك من Canva</p>
<input id="email" placeholder="إيميلك"><input id="pass" type="password" placeholder="كلمة المرور">
<button class="btn" onclick="alert('أهلاً بك 💜')">دخول</button></div>
<div class="card"><h3>نشر عمل جديد 🎨</h3>
<input id="t" placeholder="عنوان العمل"><textarea id="d" placeholder="وصف العمل"></textarea><input id="l" placeholder="رابط Canva">
<button class="btn" onclick="add()">نشر 🚀</button></div>
<div id="list" class="grid"></div>
</div>
<script>
let w=JSON.parse(localStorage.getItem('w')||'[]');
function add(){let title=document.getElementById('t').value;if(!title)return alert('اكتبي العنوان');w.unshift({title:title,desc:document.getElementById('d').value,link:document.getElementById('l').value});localStorage.setItem('w',JSON.stringify(w));render();document.getElementById('t').value='';}
function render(){document.getElementById('list').innerHTML=w.map(x=>`<div class="card"><b>${x.title}</b><p style="font-size:13px;color:#666">${x.desc||''}</p>${x.link?`<a href="${x.link}" target="_blank" style="color:#7c3aed">🔗 مشاهدة</a>`:''}</div>`).join('')||'<div class="card" style="grid-column:1/-1;text-align:center;color:#999">كوني أول مبدعة تنشر ✨</div>';}
render();
</script>
</body>
</html>
